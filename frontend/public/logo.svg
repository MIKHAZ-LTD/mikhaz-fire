      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.55" />
    </linearGradient>

    <radialGradient id="ambientGlow" cx="256" cy="288" r="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.14" />
