      <stop offset="0%" stop-color="#1a1e2e" />
      <stop offset="55%" stop-color="#10131e" />
      <stop offset="100%" stop-color="#08090e" />
    </linearGradient>

    <linearGradient id="rimGrad" x1="48" y1="48" x2="464" y2="464" gradientUnits="userSpaceOnUse">
