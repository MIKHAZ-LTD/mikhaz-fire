  <path
    d="M266 86C266 86 314 142 306 200C303 221 290 236 290 236C290 236 328 212 344 170C376 210 392 258 388 304C382 376 327 430 258 430C184 430 128 373 128 300C128 238 166 184 206 142C232 115 254 96 266 86Z"
